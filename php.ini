; ============================================================================
; php.ini - Computer Lab Management System
; ============================================================================
; Upload this file to the same folder where your application is installed
; (usually /htdocs) so InfinityFree applies these settings.
;
; Adjust the values below if your hosting limits are different.
; ============================================================================

; Upload size limits for computer photos and logo
upload_max_filesize = 5M
post_max_size = 6M

; Memory and execution limits (keep values modest for shared hosting)
memory_limit = 128M
max_execution_time = 300
max_input_time = 120

; File uploads must stay enabled
file_uploads = On

; Sessions are kept in files (default, no database needed)
session.save_handler = files

; Errors: log them but do not display them to visitors (security)
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
